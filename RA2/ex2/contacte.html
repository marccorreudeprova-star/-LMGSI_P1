<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de Pel·lícules</title>
    <meta name="description" content="Cerca pel·lícules i consulta informació de TMDB.">
    <link rel="icon" href="images/lupa.jpg">

</head>
<body>
    <header>
        <a href="https://www.themoviedb.org" >
            <img src="images/logotmdb.jpg" alt="TMDB" height ="25">
        </a>

        <nav>
            <ul>
                <li><a href="https://www.buscador.html">Buscador</a></li>
                <li><a href="https://www.contacte.html">Contacte</a></li>
            </ul>
        </nav>
    </header>

    <main>

    <section id="contacte">
        <h1>CONTACTA AMB NOSALTRES</h1>
        <p>Tens algun dubte o suggeriment? Escriu-nos.</p>

        <h2>Envia'ns un missatge</h2>

        <form>

            <label for="nom">Nom i cognoms</label>
            <input type="text" id="nom" placeholder="El teu nom complet" required>

            <label for="email">Correu electrònic</label>
            <input type="email" id="email" placeholder="nom@exemple.cat" required>

            <label for="assumpte">Assumpte</label>
            <input type="text" id="assumpte" placeholder="Sobre què ens vols escriure?" required>

            <label for="missatge">Missatge</label>
            <textarea id="missatge" placeholder="Escriu aquí el teu missatge ..." required></textarea>

            <button type="submit">Enviar</button>

        </form>
    </section>

    </main>

    <footer>
    <p>© 2026 The Movie Database - Maqueta de disseny</p>
    </footer>

</body>
</html>
